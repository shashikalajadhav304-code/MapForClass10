<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Map Pointing Practice · CBSE Class 10 SST</title>
<style>
:root{--bg:#f0f7f4;--card:#fdfdfc;--ink:#1d2330;--mut:#0f0f0f;--line:#d9d4c7;--acc:#1f5fbf;--ok:#1b8a4b;--bad:#c2372f;--land:#eaf0dc;--sea:#e4eef7;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171d;--card:#1d222b;--ink:#e8eaf0;--mut:#9aa2b1;--line:#333a47;--acc:#6ea2f5;--ok:#4cc27f;--bad:#f0746c;--land:#2a3524;--sea:#18222d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14171d;--card:#1d222b;--ink:#e8eaf0;--mut:#9aa2b1;--line:#333a47;--acc:#6ea2f5;--ok:#4cc27f;--bad:#f0746c;--land:#2a3524;--sea:#18222d;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:1000px;margin:0 auto;padding:14px}
h1{font-size:1.25rem;margin:0 0 2px}
.sub{color:var(--mut);font-size:.88rem;margin:0 0 12px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
select,button{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
button{cursor:pointer}
button.primary{background:var(--acc);border-color:var(--acc);color:#fff}
button.on{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
.grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:14px}
@media(max-width:760px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.mapwrap{overflow:hidden;border-radius:10px;background:var(--sea)}
svg{display:block;width:100%;height:auto;touch-action:manipulation}
.q{font-size:1.15rem;font-weight:600;margin:0 0 4px}
.tag{color:var(--mut);font-size:.85rem;margin:0 0 10px}
.opts{display:grid;gap:8px}
.opts button{text-align:left}
.fb{min-height:1.6em;margin:10px 0;font-weight:600}
.ok{color:var(--ok)}.bad{color:var(--bad)}
.stats{display:flex;gap:16px;margin-top:10px;color:var(--mut);font-size:.9rem}
.stats b{color:var(--ink)}
.note{font-size:.78rem;color:var(--mut);margin-top:10px}
#missed{margin:6px 0 0;padding-left:18px;font-size:.88rem}
.hidden{display:none}
</style>
</head>
<body>
<main>
<h1>Map Pointing Practice</h1>
<p class="sub">CBSE Class 10 Social Science · India map work</p>

<div class="bar">
  <select id="cat" aria-label="Topic"></select>
  <button id="m-locate" class="on">Locate</button>
  <button id="m-identify">Identify</button>
</div>

<div class="grid">
  <div class="card mapwrap" style="padding:0">
    <svg id="map" viewBox="0 0 800 943" role="img" aria-label="Map of India">
      <g id="bg"></g>
      <g id="pts"></g>
    </svg>
  </div>

  <div class="card">
    <p class="q" id="q"></p>
    <p class="tag" id="tag"></p>
    <div class="opts" id="opts"></div>
    <div class="fb" id="fb"></div>
    <button class="primary" id="next">Start</button>
    <div class="stats">
      <span>Score <b id="sc">0</b>/<b id="tt">0</b></span>
      <span>Streak <b id="st">0</b></span>
    </div>
    <div id="missedBox" class="hidden">
      <p class="tag" style="margin:12px 0 0">To revise:</p>
      <ul id="missed"></ul>
    </div>
    <p class="note" id="note"></p>
  </div>
</div>
</main>

sel.onchange=()=>{reset()};
$("m-locate").onclick=()=>setMode("locate");
$("m-identify").onclick=()=>setMode("identify");
function setMode(m){mode=m;$("m-locate").classList.toggle("on",m=="locate");$("m-identify").classList.toggle("on",m=="identify");reset()}

function reset(){score=total=streak=0;missed.clear();pool=[];cur=null;done=true;
  $("pts").innerHTML="";$("opts").innerHTML="";$("q").textContent="Ready?";$("tag").textContent=
  mode=="locate"?"You will be given a name. Tap its location on the map.":"A point will be marked. Pick its name.";
  $("fb").textContent="";$("next").textContent="Start";stats();renderMissed()}

function items(){const v=sel.value;return DATA.filter(d=>v=="all"||d.cat==v||CATS[d.cat][1]==v)}

function next(){
  if(!pool.length)pool=shuffle(items());
  cur=pool.pop();done=false;$("pts").innerHTML="";$("fb").textContent="";$("fb").className="fb";$("next").textContent="Skip";
  const [cn]=CATS[cur.cat];
  if(mode=="locate"){
    $("q").textContent="Mark: "+cur.name;$("tag").textContent=cn;$("opts").innerHTML="";
  }else{
    $("q").textContent="What is marked on the map?";$("tag").textContent=cn;
    dot(cur,"var(--acc)",true);
    const same=items().filter(d=>d.cat==cur.cat&&d.name!=cur.name);
    const others=DATA.filter(d=>d.cat==cur.cat&&d.name!=cur.name);
    const dist=shuffle((same.length>=3?same:others)).slice(0,3);
    const o=shuffle([cur,...dist]);
    $("opts").innerHTML="";
    o.forEach(d=>{const b=document.createElement("button");b.textContent=d.name;b.onclick=()=>answer(d.name==cur.name,b);$("opts").appendChild(b)});
  }
}
function dot(d,c,ring){
  if(ring)el("circle",{cx:X(d.lon,d.lat),cy:Y(d.lon,d.lat),r:16,fill:"none",stroke:c,"stroke-width":3,opacity:.5},$("pts"));
  el("circle",{cx:X(d.lon,d.lat),cy:Y(d.lon,d.lat),r:7,fill:c,stroke:"#fff","stroke-width":2},$("pts"));
}
function answer(ok,btn){
  if(done)return;done=true;total++;
  if(ok){score++;streak++}else{streak=0;missed.set(cur.cat+cur.name,cur.name+" ("+CATS[cur.cat][0]+")")}
  $("fb").textContent=ok?"Correct ✓":"Not quite. It was "+cur.name;$("fb").className="fb "+(ok?"ok":"bad");
  if(mode=="identify"){[...$("opts").children].forEach(b=>{b.disabled=true;if(b.textContent==cur.name)b.style.borderColor="var(--ok)"});if(!ok&&btn)btn.style.borderColor="var(--bad)"}
  $("next").textContent="Next";stats();renderMissed();
}
$("map").addEventListener("click",e=>{
  if(mode!="locate"||done||!cur)return;
  const s=$("map"),p=s.createSVGPoint();p.x=e.clientX;p.y=e.clientY;
  const q=p.matrixTransform(s.getScreenCTM().inverse());
  const d=Math.hypot(q.x-X(cur.lon,cur.lat),q.y-Y(cur.lon,cur.lat)), ok=d<=TOL_PX;
  el("line",{x1:q.x,y1:q.y,x2:X(cur.lon,cur.lat),y2:Y(cur.lon,cur.lat),stroke:"#555","stroke-width":2,"stroke-dasharray":"6 4"},$("pts"));
  el("circle",{cx:q.x,cy:q.y,r:7,fill:ok?"var(--ok)":"var(--bad)",stroke:"#fff","stroke-width":2},$("pts"));
  dot(cur,"var(--acc)",true);
  answer(ok);
});
$("next").onclick=()=>{
  if(!done&&cur){total++;streak=0;missed.set(cur.cat+cur.name,cur.name+" ("+CATS[cur.cat][0]+")");stats();renderMissed()}
  next();
};
function stats(){$("sc").textContent=score;$("tt").textContent=total;$("st").textContent=streak}
function renderMissed(){
  $("missedBox").classList.toggle("hidden",!missed.size);
  $("missed").innerHTML=[...missed.values()].map(t=>"<li>"+t+"</li>").join("");
}

reset();
$("note").textContent="Map: India outline map (political), mapsofindia.com. Map not to scale; for practice only.";
</script>
</body>
</html>
